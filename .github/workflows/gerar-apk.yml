name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        run: npm install

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícone, tela em pé e tela cheia
        run: |
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp www/icons/icon-512.png "$d/ic_launcher.png"
            cp www/icons/icon-512.png "$d/ic_launcher_round.png"
            cp www/icons/icon-512.png "$d/ic_launcher_foreground.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Usar sempre a mesma assinatura
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk moka-toca-fantasma.apk

      - uses: actions/upload-artifact@v4
        with:
          name: moka-toca-fantasma-apk
          path: moka-toca-fantasma.apk
